name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Same checks as ci.yml; a tag only ships if they pass.
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keep the write token out of .git/config, where build scripts could read it.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      # Fail here, before 20 minutes of builds, if CHANGELOG.md has no notes for this version.
      - name: Release notes exist
        env:
          TAG: ${{ github.ref_name }}
        run: sh .github/release-notes.sh "$TAG"

  # One draft release for all four builds to upload into. A draft is invisible to the app,
  # the website and releases/latest, so nobody is offered a half-uploaded release.
  draft:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      id: ${{ steps.create.outputs.id }}
      notes: ${{ steps.notes.outputs.body }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The CHANGELOG.md section for this version becomes the release notes, which the
      # app shows when it offers the update.
      - name: Release notes
        id: notes
        run: |
          {
            sh .github/release-notes.sh "$TAG"
            echo
            echo '---'
            echo 'Download the installer for your platform below. The builds have no Apple or Microsoft developer certificate yet, so your system warns once: macOS → System Settings → Privacy & Security → Open Anyway; Windows → More info → Run anyway. Details in the README.'
          } > "$RUNNER_TEMP/notes.md"
          { echo 'body<<PORTKEEPER_NOTES_EOF'; cat "$RUNNER_TEMP/notes.md"; echo 'PORTKEEPER_NOTES_EOF'; } >> "$GITHUB_OUTPUT"
      - name: Create draft release
        id: create
        run: |
          # Re-running the workflow reuses its draft; a published release is never touched.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft > "$RUNNER_TEMP/draft" 2>/dev/null; then
            [ "$(cat "$RUNNER_TEMP/draft")" = true ] || { echo "::error::$TAG is already published"; exit 1; }
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "Portkeeper $TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          echo "id=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId)" >> "$GITHUB_OUTPUT"

  build:
    needs: draft
    # Holds the signing key: add yourself as required reviewer in Settings -> Environments -> release.
    environment: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keep the write token out of .git/config, where build scripts could read it.
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update bundles; the app only installs updates signed with this key.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS: ad-hoc sign the whole bundle. Without it the app ships with only the
          # linker's signature and Gatekeeper reports it as "damaged" instead of offering
          # "Open Anyway". Replace with a Developer ID identity once there is one.
          APPLE_SIGNING_IDENTITY: "-"
        with:
          # Upload into the draft; publish below only once every build is in.
          releaseId: ${{ needs.draft.outputs.id }}
          # Also the "What's new" text inside latest.json.
          releaseBody: ${{ needs.draft.outputs.notes }}
          args: ${{ matrix.args }}
          # latest.json, read by the in-app updater; Windows updates through the .exe installer.
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true

  # Copies of the main installers with version-free names, so
  # releases/latest/download/<name> always points at the newest build (README, website),
  # then publish. Only runs if all four builds succeeded.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Upload version-free copies
        run: |
          mkdir dl && cd dl
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            -p '*_aarch64.dmg' -p '*_x64.dmg' -p '*_x64-setup.exe' -p '*_amd64.AppImage'
          mv *_aarch64.dmg Portkeeper-macOS-AppleSilicon.dmg
          mv *_x64.dmg Portkeeper-macOS-Intel.dmg
          mv *_x64-setup.exe Portkeeper-Windows-x64-setup.exe
          mv *_amd64.AppImage Portkeeper-Linux-x86_64.AppImage
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber Portkeeper-*
      - name: Publish
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
